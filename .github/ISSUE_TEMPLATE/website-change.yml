name: Request a website change
description: Describe an AIWC website update without writing code.
title: "Website: "
labels:
  - website
body:
  - type: markdown
    attributes:
      value: |
        Tell us what should change in ordinary language. A website editor or AI coding assistant can use this request directly.

  - type: input
    id: page
    attributes:
      label: Page
      description: Which page should change? Paste its address or give its menu name.
      placeholder: "Example: Home, Our People, or https://aiwc.org.au/contact/"
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: What should change?
      description: Describe the desired result. You do not need to mention code or files.
      placeholder: "Example: Replace the opening paragraph with the text below and make the event photo more prominent."
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Approved wording or factual details
      description: Include exact wording, dates, names, links or facts that must be used.
      placeholder: "Paste approved content here."

  - type: textarea
    id: media
    attributes:
      label: Images or documents
      description: Attach files here, or identify an existing AIWC image that should be used.
      placeholder: "Drag files into this box or describe the existing image."

  - type: dropdown
    id: urgency
    attributes:
      label: Timing
      options:
        - Routine
        - Needed this week
        - Urgent correction
    validations:
      required: true

  - type: checkboxes
    id: approval
    attributes:
      label: Content approval
      options:
        - label: The supplied facts and wording are approved for the public website.
          required: true

